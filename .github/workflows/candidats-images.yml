name: Planches de candidats photographiques

# Outil de sélection : télécharge en petite taille les candidats listés dans
# outils/candidats-images.txt, assemble une planche-contact par groupe
# (vignettes étiquetées par identifiant) et publie le tout sur la branche
# orpheline `candidats-images`, consultable depuis l'environnement de travail.

on:
  workflow_dispatch:
  push:
    branches: [claude/araste-capital-site-lcw2cv]
    paths:
      - "outils/candidats-images.txt"
      - ".github/workflows/candidats-images.yml"

permissions:
  contents: write

jobs:
  planches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null

      - name: Télécharger les aperçus et assembler les planches
        shell: bash
        run: |
          mkdir -p candidats/apercus candidats/planches
          {
            grep -v '^#' outils/candidats-images.txt | grep '|' | while IFS='|' read -r groupe id url; do
              groupe=$(echo "$groupe" | xargs); id=$(echo "$id" | xargs); url=$(echo "$url" | xargs)
              mkdir -p "candidats/apercus/$groupe"
              if curl -fsSL --retry 2 "$url?w=420&q=70&fm=jpg&fit=max" -o "candidats/apercus/$groupe/$id.jpg"; then
                echo "ok    $groupe $id"
              else
                echo "échec $groupe $id"; rm -f "candidats/apercus/$groupe/$id.jpg"
              fi
            done
            for d in candidats/apercus/*/; do
              g=$(basename "$d")
              if ls "$d"/*.jpg > /dev/null 2>&1; then
                montage "$d"/*.jpg -tile 5x -geometry 300x300+8+8 -background '#111111' -fill '#eeeeee' -pointsize 16 -label '%t' "candidats/planches/$g.jpg" 2>&1 && echo "planche $g" || echo "montage KO $g"
              fi
            done
            ls -la candidats/planches
          } 2>&1 | tee candidats/journal.txt

      - name: Publier sur la branche candidats-images
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd candidats
          git init -b candidats-images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Planches de candidats ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" candidats-images
