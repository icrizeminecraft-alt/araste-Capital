name: Site statique pour Hostinger

# Construit le site (npm run build:static) et publie le contenu de `out/` sur la
# branche `hostinger-static`, que l'hébergement web Hostinger déploie dans
# public_html à chaque mise à jour. Voir docs/DEPLOIEMENT.md.

on:
  push:
    branches: [claude/araste-capital-site-lcw2cv, main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-statique
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://arastecapital.com
      SITE_INDEXABLE: "false"
      NEXT_PUBLIC_CONTACT_ENDPOINT: php
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site statique
        run: npm run build:static

      - name: Publier out/ sur la branche hostinger-static
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -b hostinger-static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site statique construit depuis ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger-static
