name: Importer les photographies

# Télécharge les photographies listées dans outils/photos.txt (Unsplash), produit
# toutes les largeurs en AVIF et en JPEG (outils/importer-photos.mjs), consigne
# les dimensions réelles dans public/images/manifest.json et commet le tout sur
# la branche courante. Se déclenche quand la liste ou l'outil change, ou à la demande.

on:
  workflow_dispatch:
  push:
    branches: [claude/araste-capital-site-lcw2cv, main]
    paths:
      - "outils/photos.txt"
      - "outils/importer-photos.mjs"
      - ".github/workflows/import-photos.yml"

permissions:
  contents: write

concurrency:
  group: import-photos
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer sharp (hors du projet)
        run: |
          mkdir -p outils/.deps
          echo '{ "name": "import-photos-deps", "private": true }' > outils/.deps/package.json
          npm install --prefix outils/.deps --no-audit --no-fund sharp@0.34
          node -e "require('./outils/.deps/node_modules/sharp'); console.log('sharp prêt')"

      - name: Télécharger et produire les variantes
        run: node outils/importer-photos.mjs

      - name: Commettre les images sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images
          git diff --cached --quiet && echo "Rien à commettre" && exit 0
          git commit -q -m "Photographies importées depuis Unsplash (outils/photos.txt)"
          git push origin HEAD:${GITHUB_REF_NAME}
