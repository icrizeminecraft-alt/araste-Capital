name: Importer les photographies

# Télécharge les photographies listées dans outils/photos.txt (Unsplash) aux
# largeurs demandées, les enregistre dans public/images/ et les commet sur la
# branche courante. Se déclenche quand la liste change, ou à la demande.

on:
  workflow_dispatch:
  push:
    branches: [claude/araste-capital-site-lcw2cv, main]
    paths:
      - "outils/photos.txt"
      - ".github/workflows/import-photos.yml"

permissions:
  contents: write

concurrency:
  group: import-photos
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les photographies
        shell: bash
        run: |
          set -u
          mkdir -p public/images
          : > public/images/journal-import.txt
          grep -v '^#' outils/photos.txt | grep '|' | while IFS='|' read -r nom id url largeurs; do
            nom=$(echo "$nom" | xargs); url=$(echo "$url" | xargs); largeurs=$(echo "$largeurs" | xargs)
            for w in ${largeurs//,/ }; do
              cible="public/images/$nom-$w.jpg"
              if curl -fsSL --retry 3 "$url?w=$w&q=82&fm=jpg&fit=max" -o "$cible"; then
                echo "ok    $cible $(stat -c%s "$cible") octets" | tee -a public/images/journal-import.txt
              else
                echo "échec $cible" | tee -a public/images/journal-import.txt; rm -f "$cible"
              fi
            done
          done
          # Dimensions réelles, pour les attributs width/height.
          sudo apt-get install -y -qq imagemagick > /dev/null 2>&1 || true
          for f in public/images/*.jpg; do identify -format "%f %w %h\n" "$f"; done | tee public/images/dimensions.txt

      - name: Commettre les images sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git diff --cached --quiet && echo "Rien à commettre" && exit 0
          git commit -q -m "Photographies importées depuis Unsplash (outils/photos.txt)"
          git push origin HEAD:${GITHUB_REF_NAME}
