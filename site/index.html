<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>ARASTE CAPITAL</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="1; url=/fr/" />
    <link rel="alternate" hreflang="fr" href="/fr/" />
    <link rel="alternate" hreflang="en" href="/en/" />
    <script>
      (function () {
        var lang = (navigator.languages && navigator.languages[0]) || navigator.language || "fr";
        location.replace(lang.toLowerCase().indexOf("en") === 0 ? "/en/" : "/fr/");
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbfbfc; color: #0b1730; font-family: Georgia, serif; }
      a { color: #0b1730; }
    </style>
  </head>
  <body>
    <p><a href="/fr/">Français</a> · <a href="/en/">English</a></p>
  </body>
</html>
